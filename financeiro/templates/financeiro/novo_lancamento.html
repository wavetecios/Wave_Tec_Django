{% extends "base.html" %}

{% block title %}
Novo Lançamento
{% endblock %}

{% block content %}

<h2 class="mb-4">
    💰 Novo Lançamento
</h2>

<form method="POST">

    {% csrf_token %}

    <div class="mb-3">

        <label class="form-label">
            Tipo
        </label>

        <select
            name="tipo"
            class="form-select"
            required>

            <option value="RECEITA">
                Receita
            </option>

            <option value="DESPESA">
                Despesa
            </option>

        </select>

    </div>

    <div class="mb-3">

        <label class="form-label">
            Categoria
        </label>

        <select
            name="categoria"
            class="form-select"
            required>

            <option value="SERVICOS">
                Serviços
            </option>

            <option value="PECAS">
                Peças
            </option>

            <option value="ENERGIA">
                Energia
            </option>

            <option value="ALUGUEL">
                Aluguel
            </option>

            <option value="MATERIAL">
                Material
            </option>

            <option value="OUTROS">
                Outros
            </option>

        </select>

    </div>

    <div class="mb-3">

        <label class="form-label">
            Descrição
        </label>

        <input
            type="text"
            name="descricao"
            class="form-control"
            required>

    </div>

    <div class="mb-3">

        <label class="form-label">
            Valor
        </label>

        <input
            type="number"
            step="0.01"
            name="valor"
            class="form-control"
            required>

    </div>

    <div class="mb-3">

        <label class="form-label">
            Forma de Pagamento
        </label>

        <select
            name="forma_pagamento"
            class="form-select">

            <option value="DINHEIRO">
                Dinheiro
            </option>

            <option value="PIX">
                PIX
            </option>

            <option value="CARTAO">
                Cartão
            </option>

            <option value="TRANSFERENCIA">
                Transferência
            </option>

        </select>

    </div>

    <div class="mb-3">

        <label class="form-label">
            Observações
        </label>

        <textarea
            name="observacoes"
            rows="4"
            class="form-control"></textarea>

    </div>

    <button
        type="submit"
        class="btn btn-success">

        💾 Salvar

    </button>

    <a
        href="{% url 'lista_financeiro' %}"
        class="btn btn-secondary">

        Voltar

    </a>

</form>

{% endblock %}
