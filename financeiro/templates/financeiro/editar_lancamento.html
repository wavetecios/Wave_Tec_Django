{% extends "base.html" %}

{% block title %}
Editar Lançamento
{% endblock %}

{% block content %}

<h2 class="mb-4">

    ✏️ Editar Lançamento

</h2>

<form method="POST">

    {% csrf_token %}

    <div class="mb-3">

        <label class="form-label">

            Tipo

        </label>

        <select
            name="tipo"
            class="form-select">

            <option value="RECEITA"
            {% if lancamento.tipo == "RECEITA" %}selected{% endif %}>

                Receita

            </option>

            <option value="DESPESA"
            {% if lancamento.tipo == "DESPESA" %}selected{% endif %}>

                Despesa

            </option>

        </select>

    </div>

    <div class="mb-3">

        <label class="form-label">

            Descrição

        </label>

        <input
            type="text"
            name="descricao"
            class="form-control"
            value="{{ lancamento.descricao }}"
            required>

    </div>

    <div class="mb-3">

        <label class="form-label">

            Valor

        </label>

        <input
            type="number"
            step="0.01"
            name="valor"
            class="form-control"
            value="{{ lancamento.valor }}"
            required>

    </div>

    <div class="mb-3">

        <label class="form-label">

            Forma de Pagamento

        </label>

        <select
            name="forma_pagamento"
            class="form-select">

            <option value="DINHEIRO"
            {% if lancamento.forma_pagamento == "DINHEIRO" %}selected{% endif %}>
                Dinheiro
            </option>

            <option value="PIX"
            {% if lancamento.forma_pagamento == "PIX" %}selected{% endif %}>
                PIX
            </option>

            <option value="CARTAO"
            {% if lancamento.forma_pagamento == "CARTAO" %}selected{% endif %}>
                Cartão
            </option>

            <option value="TRANSFERENCIA"
            {% if lancamento.forma_pagamento == "TRANSFERENCIA" %}selected{% endif %}>
                Transferência
            </option>

        </select>

    </div>

    <div class="mb-3">

        <label class="form-label">

            Observações

        </label>

        <textarea
            name="observacoes"
            class="form-control"
            rows="4">{{ lancamento.observacoes }}</textarea>

    </div>

    <button
        class="btn btn-success">

        💾 Salvar Alterações

    </button>

    <a
        href="{% url 'lista_financeiro' %}"
        class="btn btn-secondary">

        Voltar

    </a>

</form>

{% endblock %}
