{% extends "base.html" %}

{% block title %}
Novo Equipamento
{% endblock %}

{% block content %}

<h2 class="mb-4">Novo Equipamento</h2>

<form method="POST">

    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label">Cliente</label>

        <select name="cliente" class="form-select">

            {% for cliente in clientes %}
                <option value="{{ cliente.id }}">
                    {{ cliente.nome }}
                </option>
            {% endfor %}

        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Tipo do Equipamento</label>

        <select name="tipo" class="form-select">
            <option value="TV">Televisão</option>
            <option value="NOTE">Notebook</option>
            <option value="PC">Computador</option>
            <option value="CEL">Celular</option>
            <option value="SOM">Aparelho de Som</option>
            <option value="MICRO">Micro-ondas</option>
            <option value="OUTRO">Outro</option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Marca</label>

        <input
            type="text"
            name="marca"
            class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label">Modelo</label>

        <input
            type="text"
            name="modelo"
            class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label">Número de Série</label>

        <input
            type="text"
            name="numero_serie"
            class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label">Acessórios</label>

        <textarea
            name="acessorios"
            class="form-control"
            rows="3"></textarea>
    </div>

    <div class="form-check mb-4">

        <input
            class="form-check-input"
            type="checkbox"
            id="garantia"
            name="garantia">

        <label
            class="form-check-label"
            for="garantia">

            Equipamento na garantia

        </label>

    </div>

    <button
        type="submit"
        class="btn btn-success">

        Salvar Equipamento

    </button>

</form>

{% endblock %}
