{% extends "base.html" %}

{% block title %}
Cadastro do Equipamento
{% endblock %}

{% block content %}

<div class="card shadow">

    <div class="card-header bg-primary text-white">

        <h3 class="mb-0">
            🖥 Cadastro do Equipamento
        </h3>

    </div>

    <div class="card-body">

        <!-- Fluxo do atendimento -->

        <div class="alert alert-light border mb-4">

            <strong>Fluxo do Atendimento</strong>

            <div class="mt-2">

                ✅ Cliente

                <span class="mx-2">→</span>

                <strong class="text-primary">
                    Equipamento
                </strong>

                <span class="mx-2">→</span>

                Ordem de Serviço

            </div>

        </div>

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">

                    Cliente

                </label>

                <input
                    type="text"
                    class="form-control"
                    value="{{ cliente.nome }}"
                    readonly>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Tipo do Equipamento

                </label>

                <select
                    name="tipo"
                    class="form-select"
                    required>

                    <option value="">Selecione...</option>

                    <option value="TV">Televisão</option>

                    <option value="NOTE">Notebook</option>

                    <option value="PC">Computador</option>

                    <option value="CEL">Celular</option>

                    <option value="SOM">Aparelho de Som</option>

                    <option value="MICRO">Micro-ondas</option>

                    <option value="OUTRO">Outro</option>

                </select>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Marca

                </label>

                <input
                    type="text"
                    name="marca"
                    class="form-control"
                    placeholder="Ex: Samsung, LG, Dell..."
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Modelo

                </label>

                <input
                    type="text"
                    name="modelo"
                    class="form-control"
                    placeholder="Modelo do equipamento">

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Número de Série

                </label>

                <input
                    type="text"
                    name="numero_serie"
                    class="form-control">

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Acessórios Recebidos

                </label>

                <textarea
                    name="acessorios"
                    class="form-control"
                    rows="3"
                    placeholder="Controle, cabo de força, carregador, bateria..."></textarea>

            </div>

            <div class="form-check mb-4">

                <input
                    class="form-check-input"
                    type="checkbox"
                    id="garantia"
                    name="garantia">

                <label
                    class="form-check-label"
                    for="garantia">

                    Equipamento na Garantia

                </label>

            </div>

            <div class="d-flex justify-content-between">

                <a
                    href="{% url 'novo_cliente' %}"
                    class="btn btn-secondary">

                    ← Voltar

                </a>

                <button
                    type="submit"
                    class="btn btn-success">

                    Salvar e Continuar →

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
