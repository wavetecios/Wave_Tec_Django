{% extends "base.html" %}

{% block title %}
Novo Cliente
{% endblock %}

{% block content %}

<div class="card shadow">

    <div class="card-header bg-primary text-white">

        <h3 class="mb-0">
            👤 Novo Cliente
        </h3>

    </div>

    <div class="card-body">

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">

                    Nome

                </label>

                <input
                    type="text"
                    name="nome"
                    class="form-control"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Telefone

                </label>

                <input
                    type="text"
                    name="telefone"
                    class="form-control"
                    required>

            </div>

            <div class="mb-4">

                <label class="form-label">

                    Endereço

                </label>

                <input
                    type="text"
                    name="endereco"
                    class="form-control"
                    required>

            </div>

            <div class="d-flex justify-content-between">

                <a
                    href="/"
                    class="btn btn-secondary">

                    ← Voltar

                </a>

                <button
                    type="submit"
                    class="btn btn-success">

                    Salvar e Continuar →

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
