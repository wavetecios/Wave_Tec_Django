{% extends "base.html" %}

{% block title %}
Editar Cliente
{% endblock %}

{% block content %}

<div class="card shadow">

    <div class="card-header bg-warning text-dark">

        <h3 class="mb-0">
            ✏️ Editar Cliente
        </h3>

    </div>

    <div class="card-body">

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">
                    Nome
                </label>

                <input
                    type="text"
                    name="nome"
                    class="form-control"
                    value="{{ cliente.nome }}"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Telefone
                </label>

                <input
                    type="text"
                    name="telefone"
                    class="form-control"
                    value="{{ cliente.telefone }}"
                    required>

            </div>

            <div class="mb-4">

                <label class="form-label">
                    Endereço
                </label>

                <input
                    type="text"
                    name="endereco"
                    class="form-control"
                    value="{{ cliente.endereco }}"
                    required>

            </div>

            <div class="d-flex justify-content-between">

                <a
                    href="{% url 'lista_clientes' %}"
                    class="btn btn-secondary">

                    ← Voltar

                </a>

                <button
                    type="submit"
                    class="btn btn-success">

                    💾 Salvar Alterações

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
