{% extends "base.html" %}

{% block title %}Wave Tec - Editar técnico{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-warning text-dark">
                <h4 class="mb-0">✏️ Editar técnico</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Nome do técnico</label>
                            <input type="text" name="nome" class="form-control" value="{{ tecnico.nome }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Usuário</label>
                            <input type="text" name="username" class="form-control" value="{{ tecnico.user.username }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" value="{{ tecnico.user.email|default:'' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Especialidade</label>
                            <input type="text" name="especialidade" class="form-control" value="{{ tecnico.especialidade }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Telefone</label>
                            <input type="text" name="telefone" class="form-control" value="{{ tecnico.telefone }}">
                        </div>
                        <div class="col-md-6 d-flex align-items-end">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="ativo" {% if tecnico.ativo %}checked{% endif %} id="ativoCheck">
                                <label class="form-check-label" for="ativoCheck">Ativo</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Perfil</label>
                            <select name="perfil" class="form-select" required>
                                <option value="TECNICO" {% if tecnico.perfil == 'TECNICO' %}selected{% endif %}>Técnico</option>
                                <option value="ADMIN" {% if tecnico.perfil == 'ADMIN' %}selected{% endif %}>Administrador</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a href="{% url 'lista_tecnicos' %}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Salvar alterações</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
