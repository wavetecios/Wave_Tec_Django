{% extends "base.html" %}

{% block title %}Wave Tec - Excluir técnico{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow border-danger">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0">🗑️ Excluir técnico</h4>
            </div>
            <div class="card-body">
                <p>Tem certeza que deseja excluir o técnico:</p>
                <h5 class="fw-bold">{{ tecnico.nome }}</h5>
                <p class="text-muted mb-4">Usuário: {{ tecnico.user.username }}</p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'lista_tecnicos' %}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-danger">Excluir</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
