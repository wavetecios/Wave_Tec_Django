<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>

        {% block title %}
        Wave Tec
        {% endblock %}

    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">

    <div class="container">

        <a class="navbar-brand fw-bold" href="/">

            🔧 Wave Tec

        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav me-auto">

                <li class="nav-item">

                    <a class="nav-link" href="/">

                        🏠 Home

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link" href="/clientes/">

                        👥 Clientes

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link" href="/equipamentos/">

                        🖥 Equipamentos

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link" href="/ordens/">

                        📋 Ordens

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link" href="/financeiro/">

                        💰 Financeiro

                    </a>

                </li>

            </ul>

            <!-- Pesquisa Global -->

            <form
                class="d-flex"
                method="GET"
                action="/pesquisa/">

                <input

                    class="form-control me-2"

                    type="search"

                    name="q"

                    placeholder="🔎 Pesquisar cliente, telefone, equipamento..."

                    autocomplete="off">

                <button
                    class="btn btn-warning"
                    type="submit">

                    Pesquisar

                </button>

            </form>

        </div>

    </div>

</nav>

<div class="container mt-4">

    {% block content %}
    {% endblock %}

    <hr>

    <div class="text-center text-muted mb-4">

        <small>

            Wave Tec - Sistema de Assistência Técnica © 2026

            <br>

            Desenvolvido por Cristiano Sant'Ana

        </small>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
