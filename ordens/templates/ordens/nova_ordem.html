{% extends "base.html" %}

{% block title %}
Nova Ordem de Serviço
{% endblock %}

{% block content %}

<div class="card shadow">

    <div class="card-header bg-primary text-white">

        <h3 class="mb-0">
            📋 Nova Ordem de Serviço
        </h3>

    </div>

    <div class="card-body">

        <div class="alert alert-light border mb-4">

            <strong>Fluxo do Atendimento</strong>

            <div class="mt-2">

                ✅ Cliente
                <span class="mx-2">→</span>
                ✅ Equipamento
                <span class="mx-2">→</span>
                <strong class="text-primary">
                    Ordem de Serviço
                </strong>

            </div>

        </div>

        <form method="POST">

            {% csrf_token %}

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Cliente

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="{{ cliente.nome }}"
                        readonly>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Telefone

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="{{ cliente.telefone }}"
                        readonly>

                </div>

            </div>

            <div class="row">

                <div class="col-md-4 mb-3">

                    <label class="form-label">

                        Equipamento

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="{{ equipamento.get_tipo_display }}"
                        readonly>

                </div>

                <div class="col-md-4 mb-3">

                    <label class="form-label">

                        Marca

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="{{ equipamento.marca }}"
                        readonly>

                </div>

                <div class="col-md-4 mb-3">

                    <label class="form-label">

                        Modelo

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="{{ equipamento.modelo }}"
                        readonly>

                </div>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Acessórios Recebidos

                </label>

                <textarea
                    class="form-control"
                    rows="3"
                    readonly>{{ equipamento.acessorios }}</textarea>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Defeito Relatado pelo Cliente

                </label>

                <textarea
                    name="defeito"
                    class="form-control"
                    rows="5"
                    placeholder="Descreva exatamente o defeito informado pelo cliente..."
                    required></textarea>

            </div>

            <div class="mb-4">

                <label class="form-label">

                    Observações Iniciais

                </label>

                <textarea
                    name="observacoes"
                    class="form-control"
                    rows="4"
                    placeholder="Observações da recepção..."></textarea>

            </div>

            <div class="d-flex justify-content-between">

                <a
                    href="{% url 'novo_equipamento' cliente.id %}"
                    class="btn btn-secondary">

                    ← Voltar

                </a>

                <button
                    type="submit"
                    class="btn btn-success">

                    Salvar Ordem →

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
