{% extends "base.html" %}

{% block title %}
Editar Ordem de Serviço
{% endblock %}

{% block content %}

<div class="card shadow">

    <div class="card-header bg-warning text-dark">

        <h3 class="mb-0">
            ✏️ Editar Ordem de Serviço
        </h3>

    </div>

    <div class="card-body">

        <form method="POST">

            {% csrf_token %}

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Cliente

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="{{ cliente.nome }}"
                        readonly>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Telefone

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="{{ cliente.telefone }}"
                        readonly>

                </div>

            </div>

            <div class="row">

                <div class="col-md-4 mb-3">

                    <label class="form-label">

                        Equipamento

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="{{ equipamento.get_tipo_display }}"
                        readonly>

                </div>

                <div class="col-md-4 mb-3">

                    <label class="form-label">

                        Marca

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="{{ equipamento.marca }}"
                        readonly>

                </div>

                <div class="col-md-4 mb-3">

                    <label class="form-label">

                        Modelo

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="{{ equipamento.modelo }}"
                        readonly>

                </div>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Acessórios Recebidos

                </label>

                <textarea
                    name="acessorios"
                    class="form-control"
                    rows="3">{{ ordem.acessorios }}</textarea>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Defeito Relatado pelo Cliente

                </label>

                <textarea
                    name="defeito"
                    class="form-control"
                    rows="5"
                    required>{{ ordem.defeito }}</textarea>

            </div>

            <div class="mb-4">

                <label class="form-label">

                    Observações Iniciais

                </label>

                <textarea
                    name="observacoes"
                    class="form-control"
                    rows="4">{{ ordem.observacoes }}</textarea>

            </div>

            <div class="row mb-4">

                <div class="col-md-6">
                    <label class="form-label">
                        Forma de Pagamento
                    </label>
                    <select name="forma_pagamento" class="form-select">
                        <option value="DINHEIRO" {% if ordem.forma_pagamento == "DINHEIRO" %}selected{% endif %}>Dinheiro</option>
                        <option value="PIX" {% if ordem.forma_pagamento == "PIX" %}selected{% endif %}>PIX</option>
                        <option value="CARTAO" {% if ordem.forma_pagamento == "CARTAO" %}selected{% endif %}>Cartão</option>
                        <option value="TRANSFERENCIA" {% if ordem.forma_pagamento == "TRANSFERENCIA" %}selected{% endif %}>Transferência</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">
                        Status da OS
                    </label>
                    <select name="status" class="form-select">
                        {% for valor, texto in ordem.STATUS %}
                            <option value="{{ valor }}" {% if ordem.status == valor %}selected{% endif %}>{{ texto }}</option>
                        {% endfor %}
                    </select>
                </div>

            </div>

            <div class="d-flex justify-content-between">

                <a
                    href="{% url 'lista_ordens' %}"
                    class="btn btn-secondary">

                    ← Voltar

                </a>

                <button
                    type="submit"
                    class="btn btn-success">

                    💾 Salvar Alterações

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
